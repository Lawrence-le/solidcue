tool_key: scrape_webpage
name: Scrape Webpage
description: Scrape a known webpage URL via the BeautifulSoup backend and return static
  parsed content. DISABLED — returns empty/partial content on JavaScript-rendered pages
  and extracts poorly even on some static pages. Use the Playwright browser tools
  (browser_navigate + browser_get_text) for web content extraction instead.
type: mcp
enabled: false
mcp:
  server_key: beautiful_soup
  tool_name: scrape_webpage
  input_schema:
    properties:
      url:
        title: Url
        type: string
    required:
    - url
    title: scrape_webpageArguments
    type: object
api: null
approval_mode: never
approval_risk: low
approval_prompt: null
